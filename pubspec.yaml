name: qik_talk
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Version and build number


version: 1.0.0+8




environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components & Styling
  hexcolor: ^3.0.1
  smooth_page_indicator: ^1.0.0
  shimmer: ^3.0.0

  google_fonts: ^6.2.1
  dropdown_button2: ^2.3.9
  photo_view: ^0.14.0
  marquee: ^2.3.0
  cupertino_icons: ^1.0.8
  
  # Forms & Input
  flutter_otp_text_field: ^1.1.0+2
  
  # Media & Files
  image_picker: ^1.0.7
  image_cropper: ^9.1.0
  file_picker: ^8.0.0
  flutter_contacts: ^1.1.9+2
  video_player: ^2.10.1
  better_player_plus: ^1.1.5
  
  # Audio
  just_audio: ^0.9.38
  audio_waveforms: ^1.0.4
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  hive_ce: ^2.2.3
  hive_ce_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.8.3
  flutter_callkit_incoming: ^2.0.5
  
  # Networking & API
  http: ^1.1.0
  http_parser: ^4.1.2
  dio: ^5.4.0
  socket_io_client: ^3.0.2
  retrofit: 4.8.0
  
  # State Management
  provider: ^6.0.5
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  
  # Utilities
  intl: ^0.20.2
  permission_handler: ^11.0.1
  upgrader: ^12.3.0
  url_launcher: ^6.3.0
  share_plus: ^7.2.2
  open_filex: ^4.7.0
  country_picker: ^2.0.26
  geolocator: ^11.0.0
  phone_numbers_parser: ^9.0.17
  local_auth: ^2.2.0
  
  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0
  
  # UI Patterns
  flutter_card_swiper: ^7.0.0
  
  # WebRTC
  flutter_webrtc: ^0.14.2
  
  # Architecture
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  app_links: ^6.4.1
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.0.0
  crypto: ^3.0.7
  cached_network_image: ^3.4.1
  chewie: ^1.13.0
  video_trimmer: ^5.0.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.1.1
  shorebird_code_push: ^2.0.5
  wakelock_plus: ^1.4.0
  proximity_sensor: ^1.0.2
  audioplayers: ^6.5.1
  vibration: ^3.1.7
  image: ^4.5.4
  emoji_picker_flutter: ^4.4.0
  iconly: ^1.0.1

  camera: ^0.12.0
  audio_session: ^0.1.25
  flutter_image_compress: ^2.4.0
  flutter_volume_controller: ^1.3.4
  flutter_system_ringtones: ^0.0.6
  flutter_ringtone_player: ^4.0.0+4
  gal: ^2.3.2
  screenshot: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: 2.4.13
  hive_ce_generator: ^1.4.0
  json_serializable: 6.8.0
  freezed: 2.5.2
  retrofit_generator: 8.2.1
  
  # Linting
  flutter_lints: ^5.0.0
  
  # App Icons
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  frontend_server_client: 4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/quik_talk_app-icon.png"
  # Full-bleed adaptive icon configuration
  adaptive_icon_background: "#00000000" # Fully transparent
  adaptive_icon_foreground: "images/quik_talk_app-icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

